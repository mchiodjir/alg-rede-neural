<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2em auto; }
    canvas { max-height: 500px; }
  </style>
</head>
<body>
  <h2 id = "subtitle"></h2>
  <canvas id="grafico"></canvas>
  <script>
    fetch('/data').then(r => r.json()).then(({titulo, subtitulo, tipo, ylabel, xlabel, x, dados, cores, nomes}) => {
      const qt_curvas = nomes.length;
      let dataset = Array(qt_curvas);

      for(let ii = 0; ii < qt_curvas; ii++)
      {
        dataset[ii] = { label: nomes[ii], data: dados[ii], borderColor: cores[ii],  tension: 0.1 };
      }

      document.title = titulo;
      document.getElementById('subtitle').textContent = subtitulo;

      new Chart(document.getElementById('grafico'), {
        type: 'line',
        data: {
          labels: x,
          datasets: dataset,
        },
        options: {
          scales: {
            y: { type: tipo, title: { display: true, text: ylabel } },
            x: { title: { display: true, text: xlabel } },
          },
        },
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Erro de treinamento</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2em auto; }
    canvas { max-height: 500px; }
  </style>
</head>
<body>
  <h2>Erro por época</h2>
  <canvas id="grafico"></canvas>

  <script>
    fetch('/data').then(r => r.json()).then(({ erroTre, erroVal }) => {
      const epocas = erroTre.map((_, i) => i + 1);
      new Chart(document.getElementById('grafico'), {
        type: 'line',
        data: {
          labels: epocas,
          datasets: [
            { label: 'Treino',    data: erroTre, borderColor: 'blue',  tension: 0.1 },
            { label: 'Validação', data: erroVal, borderColor: 'red',   tension: 0.1 },
          ],
        },
        options: {
          scales: {
            y: { type: 'logarithmic', title: { display: true, text: 'Erro (MSE)' } },
            x: { title: { display: true, text: 'Época' } },
          },
        },
      });
    });
  </script>
</body>
</html>
